<!DOCTYPE html>
<html lang="es-ES">
    <head>
        <meta charset="UTF-8">
        <title>Hola mundo desde DWEC</title>
        
        <!--Sección de Estilos CSS embebida -->
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 40px;
            }

            h1 {
                color: #333;
            }

            button {
                padding: 8px 16px;
                font-size: 1rem;
                cursor: pointer;
            }
        </style>
        <!--Sección de Script JS embebida -->
        <script>
            const saludar = () => {
                alert('Hola mundo desde DWEC');
            }
        </script>
    </head>

        <h1>
            Hola Mundo desde DWEC
        </h1>
        <button onclick="saludar()">Saludar</button>
    </body>
</html>
